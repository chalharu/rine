[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
ignore = [
  # Pulled in by the official oracledb driver, which has no chrono-free
  # release; there is no patched chrono release for an "unmaintained"
  # advisory, so this cannot be fixed on our side.
  "RUSTSEC-2026-0543",
]

[bans]
multiple-versions = "warn"

[licenses]
allow = [
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-3-Clause",
  # Mozilla's root-certificate data (via webpki-roots <- oracledb):
  # permissive data license, no code copyleft.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
