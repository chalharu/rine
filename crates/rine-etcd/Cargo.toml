[package]
description = "etcd-compatible API server with pluggable backends (in-memory backend included)"
edition.workspace = true
license.workspace = true
name = "rine-etcd"
version.workspace = true

[lib]
name = "rine_etcd"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
prometheus.workspace = true
prost.workspace = true
rustls.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tonic-prost.workspace = true
tracing.workspace = true

# `process_*` metrics need procfs, which only exists on Linux; the
# `process` feature (and `process_collector` module) is unavailable
# elsewhere, so enable it per-target instead of in the workspace.
[target.'cfg(target_os = "linux")'.dependencies]
prometheus = { features = ["process"], workspace = true }

[build-dependencies]
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
rcgen.workspace = true
