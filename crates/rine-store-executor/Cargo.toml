[package]
name = "rine-store-executor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Executor backend for rine-etcd, providing a standardized interface for executing store operations"

[lib]
name = "rine_store_executor"
path = "src/lib.rs"

[dependencies]
rine-etcd.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
bytes.workspace = true

[dev-dependencies]
tonic = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
