sonar.projectKey=chalharu_rine
sonar.organization=chalharu
sonar.sourceEncoding=UTF-8
sonar.exclusions=target/**,**/target/**
# Per-crate reports, not root-level: the Rust LCOV sensor resolves this
# pattern against each crate module's directory, and the repository root
# is a virtual manifest with no Rust of its own. The sonarcloud job splits
# the workspace reports accordingly (see scripts/lcov-per-crate.sh).
sonar.rust.lcov.reportPaths=lcov-*.info
