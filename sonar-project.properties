sonar.projectKey=chalharu_rine
sonar.organization=chalharu
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=target/**,**/target/**
# Per-crate reports: the Rust LCOV sensor resolves this pattern against
# each crate module's directory, and the virtual-manifest root has no Rust
# of its own, so the sonarcloud job splits the workspace reports per crate.
sonar.rust.lcov.reportPaths=lcov-*.info
