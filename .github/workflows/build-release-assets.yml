# Shared by release.yml (tag) and ci.yml (PR dry run): build the
# stripped release binary natively per arch, stamp the given version,
# and upload per-arch tarballs plus the raw binaries the Docker build
# consumes. Publishing (Release, ghcr push) always stays outside.
name: build release assets
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to stamp, with or without a v prefix (tag or dry run)'
        required: true
        type: string
env:
  CARGO_TERM_COLOR: always
jobs:
  binaries:
    name: release binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    env:
      TRIPLE: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      # Read-only cache: saving from a tag/dry-run build would let a
      # poisoned cache flow into later builds (zizmor cache-poisoning).
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          lookup-only: true
      # The caller wins over Cargo.toml: rewrite the workspace version so
      # `--version`, /version and artifact names all agree with it.
      - name: set crate version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="${VERSION_INPUT#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like X.Y.Z, got $VERSION_INPUT" >&2
            exit 1
          fi
          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
          # Keep Cargo.lock in sync so --locked still holds: only our own
          # workspace members move, every dependency stays pinned.
          python3 - "$version" <<'EOF'
          import re, sys
          version = sys.argv[1]
          members = {
              "rine", "rine-etcd", "rine-store-conformance",
              "rine-store-executor", "rine-store-oracle", "rine-store-sqlite",
          }
          current, out = None, []
          for line in open("Cargo.lock"):
              m = re.match(r'name = "([^"]+)"', line)
              if m:
                  current = m.group(1)
              if current in members and re.match(r'version = "', line):
                  line = f'version = "{version}"\n'
                  current = None
              out.append(line)
          open("Cargo.lock", "w").writelines(out)
          EOF
          grep -n '^version = ' Cargo.toml
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: build release binary
        run: cargo build --locked --release -p rine
      - name: stage artifacts
        run: |
          mkdir -p "stage/rine" dist
          cp target/release/rine "stage/rine/rine"
          cp LICENSE "stage/rine/LICENSE"
          tar -czf "dist/rine-${RELEASE_VERSION}-${TRIPLE}.tar.gz" -C stage rine
          cp target/release/rine "dist/rine-${ARCH}"
      - name: upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
