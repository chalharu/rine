# Tag-driven release: attach binaries to a GitHub Release and publish
# the image to GitHub Packages. The heavy lifting (version stamping,
# --locked release build, tarballs, Docker inputs) lives in
# build-release-assets.yml, which ci.yml also runs on PRs as a dry run
# that stops right before publishing.
name: release
on:
  push:
    tags:
      - 'v*'
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  build:
    name: build release assets
    uses: ./.github/workflows/build-release-assets.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read
  github-release:
    name: attach binaries to GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum ./* > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/*
  docker:
    name: publish image to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: image
          merge-multiple: true
      # The Dockerfile copies prebuilt per-arch binaries (no compilation
      # inside), so multi-arch needs no emulation: one stage, just COPY.
      - name: prepare build context
        run: cp Dockerfile image/Dockerfile
      - name: log in to GitHub Packages
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: set up buildx
        uses: docker/setup-buildx-action@v3.11.1
      - name: build and push
        uses: docker/build-push-action@v6.18.0
        with:
          context: image
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/chalharu/rine:${{ github.ref_name }}
            ghcr.io/chalharu/rine:latest
