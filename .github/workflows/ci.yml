name: CI
on:
  push:
    branches:
      - main
  pull_request:
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  unit:
    name: unit tests (no DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - &checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - &rust-cache
        uses: Swatinem/rust-cache@v2.9.3
      - &install-llvm-cov
        name: install cargo-llvm-cov
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: cargo-llvm-cov
      - name: unit tests with coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lcov --output-path coverage/raw-unit.info
          sh scripts/lcov-workspace.sh coverage/raw-unit.info coverage/lcov-unit.info
          rm coverage/raw-unit.info
      - name: upload coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-unit
          path: coverage/lcov-unit.info
          if-no-files-found: error
      - name: clippy
        run: cargo clippy --workspace --tests
      - name: install taplo
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: taplo@0.10.0
      - name: taplo fmt check
        run: taplo fmt --check
  oracle-xe:
    name: integration tests (Oracle XE)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      oracle:
        image: gvenzl/oracle-xe:21.3.0-slim@sha256:ecdf4302ac3d134e1bac5ef6e0c223c2d0f4d4d2b6d551aa79b2346f1ab8f792
        env:
          ORACLE_PASSWORD: TestPass123_
          APP_USER: rine
          APP_USER_PASSWORD: RinePass123_
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      ORACLE_HOST: 127.0.0.1
      ORACLE_PORT: 1521
      ORACLE_SERVICE: XEPDB1
      ORACLE_USER: rine
      ORACLE_PASSWORD: RinePass123_
      RINE_LIVE_ORACLE: 1
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - *checkout
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - *rust-cache
      - name: wait for Oracle XE (TCP + PDB open)
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/1521) 2>/dev/null; then
              echo "port 1521 open after $((i * 10))s"
              exit 0
            fi
            echo "waiting for 1521... ($i/60)"
            sleep 10
          done
          echo "Oracle XE did not open port 1521 in time"
          exit 1
      - *install-llvm-cov
      - name: full workspace tests against live XE
        run: |
          mkdir -p coverage
          cargo llvm-cov --no-report --workspace -- --nocapture
          cargo llvm-cov report --lcov --output-path coverage/raw-oracle.info
          sh scripts/lcov-workspace.sh coverage/raw-oracle.info coverage/lcov-oracle.info
          rm coverage/raw-oracle.info
      - name: upload coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-oracle
          path: coverage/lcov-oracle.info
          if-no-files-found: error
  sqlite-e2e:
    name: official client e2e (SQLite and upstream etcd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RINE_BACKEND: sqlite
      RINE_SQLITE_PATH: /tmp/rine.db
      RINE_LISTEN: 127.0.0.1:2379
    steps:
      - *checkout
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - *rust-cache
      - name: build rine
        run: cargo build --locked -p rine
      - name: start rine on the SQLite backend
        run: |
          rm -f /tmp/rine.db
          ./target/debug/rine > /tmp/rine.log 2>&1 &
          echo $! > /tmp/rine.pid
          echo "rine started"
      - name: wait for the etcd API
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/2379) 2>/dev/null; then
              echo "port 2379 open after $((i * 5))s"
              exit 0
            fi
            echo "waiting for 2379... ($i/60)"
            sleep 5
          done
          echo "rine did not open port 2379 in time"
          cat /tmp/rine.log
          exit 1
      - name: download official etcdctl (v3.5.35)
        run: |
          curl -sL --proto '=https' --tlsv1.2 https://github.com/etcd-io/etcd/releases/download/v3.5.35/etcd-v3.5.35-linux-amd64.tar.gz -o /tmp/etcd.tgz
          tar xzf /tmp/etcd.tgz -C /tmp
          /tmp/etcd-v3.5.35-linux-amd64/etcdctl version
      - name: official-client conformance
        run: ENDPOINT=127.0.0.1:2379 ETCDCTL=/tmp/etcd-v3.5.35-linux-amd64/etcdctl bash e2e/etcdctl.sh
      - name: clientv3 conformance and load smoke test
        working-directory: e2e
        env:
          GOTOOLCHAIN: auto
          ETCD_ENDPOINT: 127.0.0.1:2379
          ETCD_REFERENCE_ENDPOINT: 127.0.0.1:12379
          ETCD_PERF: "1"
          ETCD_EXTENDED: "1"
        run: |
          reference_dir="$(mktemp -d)"
          /tmp/etcd-v3.5.35-linux-amd64/etcd \
            --data-dir "$reference_dir/data" \
            --listen-client-urls http://127.0.0.1:12379 \
            --advertise-client-urls http://127.0.0.1:12379 \
            --listen-peer-urls http://127.0.0.1:12380 \
            --initial-advertise-peer-urls http://127.0.0.1:12380 \
            --initial-cluster default=http://127.0.0.1:12380 \
            > "$reference_dir/etcd.log" 2>&1 &
          reference_pid=$!
          trap 'kill "$reference_pid" 2>/dev/null || true; wait "$reference_pid" || true' EXIT
          if ! go test -mod=readonly -v -count=1 -timeout=5m -run '^(TestConformance|TestExtendedConformance|TestPerformance)$' .; then
            cat "$reference_dir/etcd.log"
            exit 1
          fi
      - name: rine server log
        if: failure()
        run: cat /tmp/rine.log
  etcdctl-e2e:
    name: official client e2e (Oracle backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      oracle:
        image: gvenzl/oracle-xe:21.3.0-slim@sha256:ecdf4302ac3d134e1bac5ef6e0c223c2d0f4d4d2b6d551aa79b2346f1ab8f792
        env:
          ORACLE_PASSWORD: TestPass123_
          APP_USER: rine
          APP_USER_PASSWORD: RinePass123_
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      RINE_BACKEND: oracle
      RINE_ORACLE_CONNECT: 127.0.0.1:1521/XEPDB1
      RINE_ORACLE_USER: rine
      RINE_ORACLE_PASSWORD: RinePass123_
      RINE_LISTEN: 127.0.0.1:2379
    steps:
      - *checkout
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - *rust-cache
      - name: wait for Oracle XE (TCP + PDB open)
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/1521) 2>/dev/null; then
              echo "port 1521 open after $((i * 10))s"
              exit 0
            fi
            echo "waiting for 1521... ($i/60)"
            sleep 10
          done
          echo "Oracle XE did not open port 1521 in time"
          exit 1
      - name: build rine
        run: cargo build --locked -p rine
      - name: start rine on the Oracle backend
        run: |
          ./target/debug/rine > /tmp/rine.log 2>&1 &
          echo $! > /tmp/rine.pid
          echo "rine started"
      - name: wait for the etcd API
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/2379) 2>/dev/null; then
              echo "port 2379 open after $((i * 5))s"
              exit 0
            fi
            echo "waiting for 2379... ($i/60)"
            sleep 5
          done
          echo "rine did not open port 2379 in time"
          cat /tmp/rine.log
          exit 1
      - name: download official etcdctl (v3.5.35)
        run: |
          curl -sL --proto '=https' --tlsv1.2 https://github.com/etcd-io/etcd/releases/download/v3.5.35/etcd-v3.5.35-linux-amd64.tar.gz -o /tmp/etcd.tgz
          tar xzf /tmp/etcd.tgz -C /tmp
          /tmp/etcd-v3.5.35-linux-amd64/etcdctl version
      - name: official-client conformance
        run: ENDPOINT=127.0.0.1:2379 ETCDCTL=/tmp/etcd-v3.5.35-linux-amd64/etcdctl bash e2e/etcdctl.sh
      - name: clientv3 conformance
        working-directory: e2e
        env:
          GOTOOLCHAIN: auto
          ETCD_ENDPOINT: 127.0.0.1:2379
          ETCD_EXTENDED: "1"
        run: go test -mod=readonly -v -count=1 -timeout=3m -run '^(TestConformance|TestExtendedConformance)$' .
      - name: rine server log
        if: failure()
        run: cat /tmp/rine.log
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    needs: [unit, oracle-xe]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - name: Split coverage per crate module
        # Sonar's Rust sensor resolves reportPaths against each crate
        # directory; the workspace root is a virtual manifest, so split.
        run: |
          for info in coverage/lcov-*.info; do
            base="$(basename "$info")"
            for d in crates/*/; do
              name="${d%/}"; name="${name#crates/}"
              awk -v prefix="SF:crates/${name}/" '
                /^SF:/ { keep = index($0, prefix) == 1 }
                keep {
                  if (/^SF:/) { $0 = "SF:" substr($0, length(prefix) + 1) }
                  print
                }
                /^end_of_record$/ { keep = 0 }
              ' "$info" > "crates/${name}/${base}"
            done
          done
          rm coverage/lcov-*.info
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  docker-image:
    name: runtime image build (amd64, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - *checkout
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - *rust-cache
      # Same layout as the release job: prebuilt binary beside the
      # Dockerfile, so Dockerfile rot fails here instead of at tag time.
      - name: build release binary and image
        run: |
          cargo build --locked --release -p rine
          cp target/release/rine rine-amd64
          docker build -f Dockerfile -t rine:ci .
