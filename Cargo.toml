[workspace]
members = [
    "crates/rine-etcd",
    "crates/rine-store-executor",
    "crates/rine-store-oracle",
    "crates/rine-store-sqlite",
    "crates/rine",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MPL-2.0"

[workspace.dependencies]
rine = { path = "crates/rine" }
rine-etcd = { path = "crates/rine-etcd" }
rine-store-executor = { path = "crates/rine-store-executor" }
rine-store-oracle = { path = "crates/rine-store-oracle" }
rine-store-sqlite = { path = "crates/rine-store-sqlite" }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
oracledb = "26.0.0-beta.6"
