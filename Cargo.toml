[workspace]
members = [
    "crates/rine-etcd",
    "crates/rine-store-executor",
    "crates/rine-store-oracle",
    "crates/rine-store-sqlite",
    "crates/rine",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
version = "0.1.0"

[workspace.dependencies]
rine = { path = "crates/rine" }
rine-etcd = { path = "crates/rine-etcd" }
rine-store-executor = { path = "crates/rine-store-executor" }
rine-store-oracle = { path = "crates/rine-store-oracle" }
rine-store-sqlite = { path = "crates/rine-store-sqlite" }
tokio = { version = "=1.54.1", features = ["full"] }
tonic = { version = "=0.14.9", features = ["transport"] }
tonic-prost = "=0.14.9"
prost = "=0.14.6"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
bytes = "=1.12.2"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
async-trait = "=0.1.92"
oracledb = "=26.0.0-beta.6"
tonic-prost-build = "=0.14.9"
protoc-bin-vendored = "=3.3.0"
tokio-stream = { version = "=0.1.19", features = ["sync"] }
clap = { version = "=4.6.8", features = ["derive", "env"] }
futures-core = "=0.3.34"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
